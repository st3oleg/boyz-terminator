<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminator — video e ping</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050a12; color: #e2e8f0; font: 15px system-ui, sans-serif; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 18px; background: #0f172a; border-bottom: 1px solid #334155; }
    strong { color: #38bdf8; margin-right: auto; }
    a { color: #93c5fd; text-decoration: none; padding: 6px 8px; border-radius: 6px; }
    a:hover, a[aria-current="page"] { background: #1e3a5f; }
    main { position: relative; flex: 1; display: grid; place-items: center; min-height: 60vh; overflow: hidden; }
    #video { display: block; max-width: 100%; max-height: calc(100vh - 68px); object-fit: contain; }
    #video-status { position: absolute; bottom: 14px; left: 14px; padding: 7px 10px; border-radius: 6px; background: #0f172ad9; }
    #ping { position: absolute; top: 14px; left: 14px; padding: 9px 12px; border-radius: 8px; background: #0f172ae6; font: 700 15px ui-monospace, monospace; color: #facc15; }
    small { display: block; padding: 7px 18px; color: #94a3b8; background: #0f172a; }
  </style>
</head>
<body>
  <header>
    <strong id="title">Terminator — Camera</strong>
    <a href="/camera/usb1" data-camera="usb1">USB 1</a>
    <a href="/camera/usb2" data-camera="usb2">USB 2</a>
    <a href="/camera/csi" data-camera="csi">CSI</a>
    <a href="/autopilota.html">Autopilota</a>
  </header>
  <main>
    <img id="video" alt="Video della camera selezionata">
    <div id="ping" role="status">RTT robot: misurazione…</div>
    <div id="video-status" role="status">Connessione video…</div>
  </main>
  <small>RTT browser ↔ server: misura la risposta HTTP del robot, non il ritardo dei fotogrammi.</small>
  <script>
    const cameras = {
      usb1: { name: 'EMEET USB 1', stream: `http://${location.hostname}:8081/stream` },
      usb2: { name: 'EMEET USB 2', stream: `http://${location.hostname}:8082/stream` },
      csi: { name: 'CSI', stream: '/camera/csi/stream' }
    };
    const key = location.pathname.split('/').pop();
    const camera = cameras[key];
    const video = document.getElementById('video');
    const videoStatus = document.getElementById('video-status');
    const ping = document.getElementById('ping');
    document.getElementById('title').textContent = `Terminator — ${camera.name}`;
    document.querySelector(`[data-camera="${key}"]`).setAttribute('aria-current', 'page');

    function connectVideo() {
      videoStatus.textContent = 'Connessione video…';
      video.src = `${camera.stream}?t=${Date.now()}`;
    }
    video.onload = () => { videoStatus.textContent = 'Video attivo'; };
    video.onerror = () => {
      videoStatus.textContent = 'Video non disponibile; nuovo tentativo tra 3 s';
      setTimeout(connectVideo, 3000);
    };
    setInterval(() => {
      if (video.naturalWidth > 0) videoStatus.textContent = 'Video attivo';
    }, 1000);

    let measuring = false;
    async function measurePing() {
      if (measuring || document.hidden) return;
      measuring = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      const start = performance.now();
      try {
        const response = await fetch(`/camera/ping?t=${Date.now()}`, {
          cache: 'no-store', signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const ms = Math.round(performance.now() - start);
        ping.textContent = `RTT robot: ${ms} ms`;
        ping.style.color = ms < 150 ? '#4ade80' : ms < 400 ? '#facc15' : '#f87171';
      } catch {
        ping.textContent = 'RTT robot: non raggiungibile';
        ping.style.color = '#f87171';
      } finally {
        clearTimeout(timeout);
        measuring = false;
      }
    }
    connectVideo();
    measurePing();
    setInterval(measurePing, 2000);
  </script>
</body>
</html>
